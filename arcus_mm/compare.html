<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcus BTC / ETH</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e6edf7;font:15px system-ui;padding:32px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px}small,.label{color:#92a2ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:24px 0}.card,section{background:#151e30;border:1px solid #27344c;border-radius:14px;padding:20px}.value{font-size:25px;margin-top:12px}.status{color:#6ee7b7}button{background:#b63648;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #27344c}#reason{color:#fca5a5;overflow-wrap:anywhere}section{margin-bottom:18px}@media(max-width:600px){body{padding:16px}header{align-items:flex-start;flex-direction:column}}
 .account{margin-top:30px}.reason{color:#fca5a5}h2{margin-bottom:8px}</style><header><div><small>ARCUS / BTC + ETH / PAPER</small><h1>BTC / ETH 双市场模拟对比</h1><p>每个账户 100 USD，资金、持仓和损益独立计算</p></div><button id="stop">停止全部模拟并撤单</button></header><p id="message"></p><main id="accounts"></main><small id="updated"></small><script>
const $=id=>document.getElementById(id);let pending=false;
function pnl(value){if(value===null||value===undefined||value==='')return '\u2014';const n=Number(value);if(!Number.isFinite(n))return '\u2014';const text=n.toFixed(3);return text==='-0.000'?'0.000':text}
const states={running:'\u8fd0\u884c\u4e2d',paused:'\u6682\u505c\u62a5\u4ef7',halting:'\u6b63\u5728\u505c\u6b62',stopped:'\u5df2\u505c\u6b62'};
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function render(s){const a=node('div',undefined,'account');a.append(node('h2',s.market+' / '+states[s.state]),node('small','\u7eb8\u9762\u6a21\u62df / '+s.strategy));
const grid=node('div',undefined,'grid');for(const [label,value] of [['\u521d\u59cb\u8d44\u91d1 USD',s.initial_equity],['\u5f53\u524d\u6743\u76ca USD',s.equity],['\u4e70\u4e00 / \u5356\u4e00',(s.bid??'\u2014')+' / '+(s.ask??'\u2014')],['\u51c0\u6301\u4ed3 '+s.market.split('-')[0],s.position],['\u5df2\u5b9e\u73b0\u635f\u76ca USD',pnl(s.metrics.realized_pnl)],['\u672a\u5b9e\u73b0\u635f\u76ca USD',pnl(s.metrics.unrealized_pnl)],['\u6210\u4ea4\u989d USD',s.metrics.volume_usd],['\u7d2f\u8ba1\u8d39\u7528 USD',s.metrics.fees]]){const c=node('div',undefined,'card');c.append(node('div',label,'label'),node('div',value??'\u2014','value'));grid.append(c)}a.append(grid);
const sec=node('section');sec.append(node('h3','\u65f6\u949f\u4e0e\u4fdd\u62a4'),node('p','\u884c\u60c5\uff1a'+(s.connected?'\u5df2\u8fde\u63a5':'\u65ad\u5f00')+' / \u6821\u65f6\uff1a'+(s.clock_fault?'\u5f02\u5e38':s.clock_pending?'\u6682\u505c':'\u6b63\u5e38')+' / '+s.offset_ms.toFixed(2)+' ms'),node('p',s.halt??'','reason'),node('small',s.flatten_on_stop?'\u505c\u6b62\u65f6\u64a4\u5355\u5e76\u5c1d\u8bd5\u6a21\u62df\u5e73\u4ed3':'\u505c\u6b62\u65f6\u64a4\u5355\u5e76\u4fdd\u7559\u6a21\u62df\u6301\u4ed3'));a.append(sec);
const orders=node('section');orders.append(node('h3','\u5f53\u524d\u6302\u5355'));const t=node('table'),head=node('tr');for(const x of ['\u65b9\u5411','\u4ef7\u683c','\u5269\u4f59\u6570\u91cf','\u72b6\u6001'])head.append(node('th',x));t.append(head);for(const o of s.orders){const tr=node('tr');for(const x of [o.side,o.price,o.remaining,o.status])tr.append(node('td',x));t.append(tr)}orders.append(t);a.append(orders);return a}
async function poll(){try{const r=await fetch('/api/status');if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data.accounts))throw Error();$('accounts').replaceChildren(...data.accounts.map(render));$('stop').disabled=pending||data.accounts.every(s=>s.halt||s.state==='stopped');$('updated').textContent='\u6700\u540e\u66f4\u65b0 '+new Date().toLocaleTimeString()}catch(e){$('message').textContent='\u670d\u52a1\u5668\u4e0d\u53ef\u8fbe\uff0c\u72b6\u6001\u672a\u77e5';$('stop').disabled=true}setTimeout(poll,1000)}
$('stop').onclick=async()=>{pending=true;$('stop').disabled=true;try{const r=await fetch('/api/stop',{method:'POST',headers:{'X-Control-Token':'__TOKEN__'}});if(!r.ok)throw Error();$('message').textContent='\u5df2\u8bf7\u6c42\u505c\u6b62\u4e24\u4e2a\u6a21\u62df\u8d26\u6237'}catch(e){$('message').textContent='\u505c\u6b62\u8bf7\u6c42\u5931\u8d25'}finally{pending=false}};poll();
</script></html>
