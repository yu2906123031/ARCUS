<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcus 交易服务器监控</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#121b28;--line:#253348;--muted:#8b9bb1;--green:#65deb2;--red:#fb9292;--gold:#f1c677}*{box-sizing:border-box}body{background:var(--bg);color:#e5edf8;font:14px system-ui;margin:0;padding:28px;max-width:1500px;margin:auto}header,.sectionhead,.statusline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:26px;margin:8px 0}h2{font-size:16px;margin:0 0 18px}small,.muted,.label{color:var(--muted)}.statusline{justify-content:flex-start}.badge{padding:5px 10px;border-radius:20px;background:#203349;font-size:12px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--gold)}button{background:#a82d44;color:white;border:1px solid #ce4a60;border-radius:9px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px}.value{font-size:26px;margin:10px 0 7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{margin-bottom:16px;min-width:0}.kv{display:grid;grid-template-columns:1fr auto;gap:10px 18px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.bar{height:7px;background:#253348;border-radius:6px;overflow:hidden;margin:10px 0 16px}.bar div{height:100%;background:var(--green);width:0;transition:width .3s}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}td,th{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--muted);font-weight:500}.empty{text-align:center;color:var(--muted);padding:24px}.alert{display:none;border:1px solid #804638;background:#2c2020;color:#f6c3b1;padding:14px;border-radius:9px;margin-top:16px;white-space:pre-wrap}.event{display:grid;grid-template-columns:76px 140px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}.foot{margin:8px 0 20px;font-size:12px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}#events{max-height:290px;overflow:auto}#fills{max-height:350px}a{color:var(--green)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}@media(max-width:600px){body{padding:14px}.value{font-size:21px}.card,section{padding:15px}.event{grid-template-columns:65px 1fr}.event span:last-child{grid-column:1/-1}.kv{gap:10px}.cards{gap:10px}}
</style></head><body>
<header><div><small id="market">ARCUS / BTC-USD</small><h1>交易服务器监控</h1><div class="statusline"><span id="state" class="badge">连接中</span><span id="mode" class="muted">—</span><span id="uptime" class="muted">—</span></div></div><button id="stop" disabled>停止交易并请求平仓</button></header>
<div id="reason" class="alert" role="status"></div><div class="cards" id="cards"></div>
<div class="columns"><section><h2>持仓与风险预算</h2><div id="position" class="kv"></div><div class="sectionhead" style="margin-top:18px"><span class="muted">持仓上限使用率</span><span id="positionPct">—</span></div><div class="bar"><div id="positionBar"></div></div><div class="sectionhead"><span class="muted">浮亏止损预算使用率</span><span id="stopPct">—</span></div><div class="bar"><div id="stopBar"></div></div><div id="risk" class="kv"></div><div class="note">名义金额按权益比例计算，不乘以杠杆。止损使用对手价浮亏，触发后请求减仓平仓。预计平仓损益包含估算退出手续费，不包含未来资金费和市场冲击。</div></section>
<section><h2>连接、账户核对与保护</h2><div id="health" class="kv"></div><h2 style="margin-top:24px">会话恢复</h2><div id="recovery" class="kv"></div><p id="policy" class="note"></p></section></div>
<section><div class="sectionhead"><h2>当前挂单</h2><small id="orderSummary">—</small></div><div class="scroll"><table><thead><tr><th>档位 / 方向</th><th>限价 USD</th><th>原始数量</th><th>剩余数量</th><th>剩余名义金额</th><th>状态</th><th>仅减仓</th><th>存续时间</th><th>交易所订单 ID</th></tr></thead><tbody id="orders"></tbody></table></div></section>
<div class="columns"><section><div class="sectionhead"><h2>近期成交</h2><small>最近 30 笔 · 当前进程记录</small></div><div class="scroll" id="fills"><table><thead><tr><th>时间</th><th>方向</th><th>价格</th><th>数量</th><th>手续费</th><th>角色</th></tr></thead><tbody id="fillRows"></tbody></table></div></section><section><div class="sectionhead"><h2>运行事件</h2><small>最近 40 条关键事件</small></div><div id="events"></div></section></div>
<div class="foot" id="updated">状态每秒刷新 · 等待服务器</div>
<script>
const $=id=>document.getElementById(id);let pending=false,lastUpdate=null;const states={running:'运行中',paused:'暂停报价 / 等待就绪',halting:'正在停止',stopped:'已停止'};
function num(x,d=2){if(x===null||x===undefined||x==='')return '—';const n=Number(x);return Number.isFinite(n)?(Object.is(n,-0)?0:n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}
const usd=x=>num(x,4),qty=x=>num(x,8),pct=x=>num(x,1)+'%',seconds=x=>x==null?'—':num(x,1)+' s';
function stamp(x){return x?new Date(Number(x)/1e6).toLocaleTimeString('zh-CN',{hour12:false}):'—'}
function duration(x){return x==null?'—':Math.floor(x/3600)+'时 '+Math.floor(x%3600/60)+'分 '+Math.floor(x%60)+'秒'}
function kv(id,rows){const nodes=[];for(const [k,v] of rows){let a=document.createElement('span'),b=document.createElement('span');a.textContent=k;b.textContent=v??'—';nodes.push(a,b)}$(id).replaceChildren(...nodes)}
function card(label,value,sub='',signed=false){let el=document.createElement('div');el.className='card';let l=document.createElement('div'),v=document.createElement('div'),s=document.createElement('div');l.className='label';v.className='value';s.className='sub';l.textContent=label;v.textContent=value;s.textContent=sub;if(signed){const n=Number(sub.split('|')[1]);v.classList.add(n<0?'bad':'good');s.textContent=sub.split('|')[0]}el.append(l,v,s);return el}
function table(id,rows,count,empty){$(id).replaceChildren(...rows.map(row=>{let tr=document.createElement('tr');for(const v of row){let td=document.createElement('td');td.textContent=v??'—';tr.append(td)}return tr}));if(!rows.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=count;td.className='empty';td.textContent=empty;tr.append(td);$(id).append(tr)}}
function bar(prefix,value){$(prefix+'Pct').textContent=value==null?'—':pct(value);$(prefix+'Bar').style.width=Math.max(0,Math.min(100,Number(value)||0))+'%';$(prefix+'Bar').style.background=Number(value)>=100?'var(--red)':Number(value)>=75?'var(--gold)':'var(--green)'}
function render(s){let m=s.metrics||{},r=s.risk||{},h=s.health||{},rec=s.recovery||{},p=s.pricing||{};const base=s.market.split('-')[0];$('market').textContent='ARCUS / '+s.market;$('state').textContent=states[s.state]||s.state;$('state').className='badge '+(s.state==='running'?'good':s.halt?'bad':'warn');$('mode').textContent=(s.mode==='live'?'实盘':'纸面模拟')+' · '+s.strategy+' · '+r.leverage+'倍';$('uptime').textContent='运行 '+duration(s.uptime_seconds);
$('cards').replaceChildren(...[
card('交易所总权益 USD',usd(s.account_equity),s.mode==='live'?'账户核对后最新值':'纸面模式无交易所账户'),card('机器人风控权益 USD',usd(s.risk_equity),'启动基准 '+usd(s.initial_equity)+' · 资金计算上限 '+usd(r.capital_cap)),card('可用保证金 USD',usd(s.free_collateral),'交易所 freeCollateral'),card('净持仓 '+base,qty(s.position),(Number(s.position)>0?'多头':Number(s.position)<0?'空头':'无持仓')+' · 名义金额 '+usd(s.position_notional)+' USD'),
card('已实现损益 USD',usd(m.realized_pnl),'手续费单独统计|'+m.realized_pnl,true),card('未实现损益 USD',usd(m.unrealized_pnl),'按中间价估算|'+m.unrealized_pnl,true),card('预计平仓损益 USD',usd(m.estimated_exit_pnl),'扣费并估算退出成本|'+m.estimated_exit_pnl,true),card('累计成交额 USD',num(m.volume_usd),'Maker '+num(m.maker_volume_usd)+' · 费用 '+usd(m.fees))]);
kv('position',[['持仓均价 USD',num(s.average_entry)],['买一 / 卖一 USD',num(s.bid)+' / '+num(s.ask)],['盘口价差',num(s.spread_bps,3)+' bps'],['买一 / 卖一数量 '+base,qty(s.bid_size)+' / '+qty(s.ask_size)],['最大持仓名义金额 USD',usd(r.position_limit_usd)],['买侧全部成交后敞口 USD',usd(r.worst_buy_usd)],['卖侧全部成交后敞口 USD',usd(r.worst_sell_usd)]]);bar('position',r.position_usage_pct);bar('stop',r.stop_usage_pct);
kv('risk',[['单笔 / 持仓上限比例',pct(Number(r.order_fraction)*100)+' / '+pct(Number(r.position_fraction)*100)],['浮亏止损阈值',pct(Number(r.stop_fraction)*100)+' · '+usd(r.stop_budget_usd)+' USD'],['按对手价浮动损益 USD',usd(r.floating_pnl_at_exit)],['下单 / 请求故障次数',(r.order_failures??'—')+' / '+(r.request_failures??'—')+'（阈值 '+r.max_failures+'）'],['报价半价差 / 重挂阈值',num(p.spread_bps,3)+' / '+num(p.reprice_bps,3)+' bps'],['库存中心偏移',num(p.inventory_shift_bps,3)+' bps'],['短窗价格波动 / 费用底线',num(p.volatility_bps,3)+' / '+num(p.fee_floor_bps,3)+' bps'],['Maker 成交占比',p.maker_volume_pct==null?'—':pct(p.maker_volume_pct)],['费用后损益 USD',usd(p.net_pnl)],['未确认订单数',p.unconfirmed_orders??'—'],['Maker / Taker 费率',(s.fees.maker==null?'—':num(Number(s.fees.maker)*100,4)+'%')+' / '+(s.fees.taker==null?'—':num(Number(s.fees.taker)*100,4)+'%')],['估算磨损 USD / 成交额',usd(m.estimated_wear_usd)+' / '+(m.wear_per_dollar==null?'—':pct(Number(m.wear_per_dollar)*100))]]);
kv('health',[['交易启动状态',h.trading_enabled?'已启用交易':'等待交易保护就绪'],['保护模式',h.protection_mode==='software_only'?'仅软件保护':'服务端 + 软件保护'],['软件监控状态',h.software_protection_active?'已运行':'尚未运行 / 正在停止'],['服务端保护状态',h.protection_mode==='software_only'?'已禁用（用户配置）':h.protection_active?'已启用':'尚未启用或已过期'],['保护配额限制',h.protection_block_reason==='daily_trigger_limit'?'今日自动触发次数已用尽（10 次）':'无'],['保护下次尝试时间',h.protection_retry_at_ms?new Date(h.protection_retry_at_ms).toLocaleString('zh-CN'):'—'],['限流冷却剩余',seconds(h.cooldown_seconds)],['连续限流次数',h.rate_limit_streak??0],['写请求最小间隔',seconds(h.mutation_interval_seconds)],['被拒绝的写接口',(h.forbidden_actions||[]).join(', ')||'无'],['撤单清理结果',h.cancel_cleanup_failed?'失败，需核对交易所挂单':'无已记录失败'],['行情 WebSocket',s.connected?'已连接':'未连接'],['行情有效性 / 接收距今',(s.market_fresh?'有效':'暂停报价')+' / '+seconds(s.book_age_seconds)],['订阅就绪',(h.ready_channels||[]).join(', ')||'等待订阅'],['未就绪订阅',(h.missing_channels||[]).join(', ')||'无'],['账户 / 成交一致性',h.account_synced===null?'—':h.account_synced?'已核对':'等待核对'],['交易所净持仓 '+base,qty(h.account_position)],['账户 / 成交序号',(h.account_sequence??'—')+' / '+(h.fill_sequence??'—')],['账户更新距今 / 目标间隔',seconds(h.account_age_seconds)+' / '+seconds(r.account_refresh_seconds)],['本地断线停止阈值',seconds(r.disconnect_seconds)],['服务端保护续期间隔',seconds(h.protection_refresh_seconds)],['服务端保护剩余时间',seconds(h.protection_remaining_seconds)],['服务端撤单保护期限 / 刷新距今',seconds(h.protection_lead_seconds)+' / '+seconds(h.protection_age_seconds)],['校时状态',s.clock_fault?'异常':s.clock_pending?'采样中 / 暂停报价':'正常'],['时钟偏差 / 校时距今',num(s.offset_ms)+' ms / '+seconds(s.clock_age_seconds)],['最近连接错误',h.last_error||'无']]);
kv('recovery',[['重启自动接管',rec.enabled?'已启用':'未启用'],['本次启动',rec.resumed?'已重放成交并接管持仓':'新会话'],['恢复原始风险基准 USD',rec.info?usd(rec.info.initial_equity):'—'],['成交回放起点',rec.info?new Date(Number(rec.info.since_us)/1000).toLocaleString('zh-CN'):'—'],['请求确认恢复中',h.recovering?'是':'否']]);
$('policy').textContent=(s.flatten_on_stop?'手动停止会撤单并请求 reduce-only 平仓，需以最终账户持仓确认结果。':'手动停止会撤单并保留持仓。')+(h.protection_mode==='software_only'?' 软件保护需要进程持续运行及 REST 可达，崩溃或完全断网时无法保证撤单。':'');$('stop').textContent=s.flatten_on_stop?'停止交易并请求平仓':'停止交易并撤单';$('reason').style.display=s.halt||s.pause_reason?'block':'none';$('reason').textContent=s.halt?'停止原因：'+s.halt:s.pause_reason||'';
table('orders',s.orders.map(o=>[o.slot+' / '+o.side,num(o.price),qty(o.quantity),qty(o.remaining),usd(o.notional),o.status,o.reduce_only?'是':'否',seconds(o.age_seconds),o.order_id||'待确认']),9,'当前无挂单');$('orderSummary').textContent=s.orders.length+' 笔 · 挂单名义金额 '+usd(s.orders.reduce((v,o)=>v+Number(o.notional),0))+' USD';
table('fillRows',(s.fills||[]).map(f=>[stamp(f.time_ns),f.side,num(f.price),qty(f.quantity),usd(f.fee),f.role||(f.maker?'MAKER':'TAKER')]),6,'当前进程尚无成交记录');
const labels={software_protection_enabled:'软件保护已启用',software_cancel_confirmed:'软件监控撤单已确认',software_cancel_failed:'软件监控撤单未确认',protection_armed:'撤单保护已续期',protection_disarmed:'订单清理完成 · 已解除保护',protection_retained:'保留服务端兜底保护',protection_quota_exhausted:'今日保护配额耗尽',trading_enabled:'交易保护就绪',rate_limit_pause:'限流暂停',cancel_wait:'等待冷却后撤单',quote_retry:'报价失效 · 等待下一轮',auto_resume_selected:'选择恢复日志',preflight:'账户启动检查通过',halt:'触发停止',fatal:'运行错误',ws_connected:'行情连接成功',ws_disconnected:'行情断开',request_failed:'请求失败',mutation_rejected:'变更请求被拒绝',mutation_uncertain:'请求结果待确认',mutation_recovered:'请求确认恢复',mutation_recovery_failed:'请求确认失败',cancel_all_confirmed:'撤单已确认',exit_attempt:'发起减仓平仓',clock_unavailable:'校时暂不可用',order_state:'订单被拒绝'};
$('events').replaceChildren(...(s.events||[]).map(e=>{let d=document.createElement('div');d.className='event';for(const v of [stamp(e.time_ns),labels[e.event]||e.event,[e.reason,e.rejection_reason,e.action,e.rejection_class,e.response_kind,e.retry_seconds?('等待 '+num(e.retry_seconds,1)+' s'):'',e.status_code?('HTTP '+e.status_code):'',e.error_type].filter(Boolean).join(' · ')||'—']){let n=document.createElement('span');n.textContent=v;d.append(n)}return d}));if(!s.events?.length){$('events').textContent='等待运行事件'}
$('stop').disabled=pending||!!s.halt||s.state==='stopped';lastUpdate=new Date();$('updated').textContent='最后更新 '+lastUpdate.toLocaleTimeString()+' · 每秒刷新 · 近期记录只覆盖当前进程，累计损益可包含恢复的历史会话';}
async function poll(){try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();render(await r.json())}catch(e){$('state').textContent='服务器不可达 · 交易状态未知';$('state').className='badge bad';$('stop').disabled=true;$('updated').textContent='连接中断，当前数值已过期 · 最后成功更新 '+(lastUpdate?lastUpdate.toLocaleTimeString():'—')}setTimeout(poll,1000)}
$('stop').onclick=async()=>{pending=true;$('stop').disabled=true;try{const r=await fetch('/api/stop',{method:'POST',headers:{'X-Control-Token':'__TOKEN__'},signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();$('reason').style.display='block';$('reason').textContent='已提交停止请求，等待撤单和持仓核对'}catch(e){$('reason').style.display='block';$('reason').textContent='停止请求未确认，请检查服务器；不要将当前持仓视为已平仓'}finally{pending=false}};poll();
</script></body></html>
